
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tushto Poll Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

<style>
:root {
  --bg: #f3f5f8;
  --panel: #ffffff;
  --ink: #172033;
  --muted: #667085;
  --line: #e2e7ef;
  --accent: #2459d3;
  --accent-light: #e8efff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 system-ui, sans-serif;
}

header {
  background: linear-gradient(120deg, #142650, #2459d3);
  color: white;
  padding: 28px 22px 32px;
}

.head-inner, main {
  max-width: 1180px;
  margin: auto;
}

header h1 {
  margin: 0;
  font-size: clamp(1.65rem, 4vw, 2.4rem);
  letter-spacing: -.04em;
}

header p {
  margin: 7px 0 0;
  color: #dce6ff;
}

main { padding: 24px 18px 44px; }

.menu-panel, .chart-panel, .info-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 12px 32px #16213a0b;
}

.menu-panel {
  padding: 20px;
  margin-bottom: 18px;
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: .1em;
  font-size: .72rem;
  font-weight: 800;
  color: var(--muted);
  margin: 0 0 10px;
}

.menu-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.menu-btn {
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: white;
  padding: 14px 13px;
  cursor: pointer;
  color: var(--ink);
  font: inherit;
  transition: .15s;
}

.menu-btn strong {
  display: block;
  font-size: .95rem;
  line-height: 1.3;
}

.menu-btn span {
  display: block;
  color: var(--muted);
  font-size: .8rem;
  margin-top: 6px;
}

.menu-btn:hover {
  border-color: #9bb5fa;
  transform: translateY(-1px);
}

.menu-btn.active {
  background: var(--accent-light);
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin: 20px 0 14px;
}

.toolbar h2 {
  font-size: 1.3rem;
  margin: 0;
  letter-spacing: -.025em;
}

.controls {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

select, .toggle, input[type="number"] {
  font: inherit;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  padding: 9px 12px;
}

.toggle { cursor: pointer; }

.months-control {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: .88rem;
  white-space: nowrap;
}

.months-control input { width: 86px; }

.toggle.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.party-picker { position: relative; }

.party-picker-panel {
  position: absolute;
  z-index: 20;
  top: calc(100% + 8px);
  right: 0;
  width: min(390px, calc(100vw - 36px));
  max-height: 360px;
  overflow: auto;
  padding: 12px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 12px 30px #16213a20;
}

.party-picker-actions {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}

.party-picker-actions button {
  border: 1px solid var(--line);
  background: #f7f9fc;
  border-radius: 8px;
  padding: 6px 9px;
  font: inherit;
  font-size: .82rem;
  cursor: pointer;
}

.party-checkboxes {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 2px 10px;
}

.party-option {
  display: flex;
  align-items: center;
  min-width: 0;
  gap: 7px;
  padding: 6px 3px;
  font-size: .88rem;
  cursor: pointer;
}

.party-option input {
  accent-color: var(--accent);
  flex: none;
}

.party-option .swatch {
  width: 10px;
  height: 10px;
}

.party-option span:last-child { overflow-wrap: anywhere; }

.chart-panel { padding: 18px 18px 12px; }

.chart-wrap {
  position: relative;
  height: 480px;
  width: 100%;
}

.chart-note {
  color: var(--muted);
  font-size: .86rem;
  margin: 10px 2px 3px;
}

.legend {
  display: flex;
  gap: 8px 14px;
  flex-wrap: wrap;
  margin: 14px 2px 4px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: .82rem;
  color: #39445a;
}

.swatch {
  width: 11px;
  height: 11px;
  border-radius: 3px;
  display: inline-block;
  flex: none;
}

.info-panel {
  margin-top: 18px;
  padding: 18px;
}

.info-panel h3 {
  margin: 0 0 6px;
  font-size: 1rem;
}

.info-panel p {
  margin: 0;
  color: var(--muted);
  font-size: .9rem;
}

footer {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 18px 28px;
  color: var(--muted);
  font-size: .82rem;
}

[hidden] { display: none !important; }

@media (max-width: 850px) {
  .menu-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .chart-wrap { height: 420px; }
}

@media (max-width: 520px) {
  main { padding: 16px 10px 30px; }
  .menu-panel { padding: 14px; }
  .menu-grid { grid-template-columns: 1fr 1fr; gap: 7px; }
  .menu-btn { padding: 11px 10px; }
  .chart-panel { padding: 12px; }
  .chart-wrap { height: 380px; }
  .toolbar { align-items: flex-start; }
  .toolbar h2 { width: 100%; }
}
</style>
</head>

<body>
<header>
  <div class="head-inner">
    <h1>Tushto Poll Tracker</h1>
    <p>Explore party polling, election comparisons and political blocs over time.</p>
  </div>
</header>

<main>
  <section class="menu-panel">
    <p class="eyebrow">Choose a view</p>
    <div class="menu-grid">
      <button class="menu-btn active" data-view="polls">
        <strong>Newest vs. previous poll</strong>
        <span>Compare the latest two party polls</span>
      </button>

      <button class="menu-btn" data-view="election">
        <strong>Newest poll vs. election</strong>
        <span>Compare polling with the previous election</span>
      </button>

      <button class="menu-btn" data-view="parties">
        <strong>Party developments</strong>
        <span>Track each party across the months</span>
      </button>

      <button class="menu-btn" data-view="blocs">
        <strong>Left, centre &amp; right</strong>
        <span>Track political-bloc totals over time</span>
      </button>
    </div>
  </section>

  <div class="toolbar">
    <h2 id="viewTitle">Newest poll vs. previous poll</h2>
    <div class="controls">
      <div id="partyPicker" class="party-picker" hidden>
        <button id="partyPickerToggle" class="toggle" type="button"
                aria-expanded="false" aria-controls="partyPickerPanel">
          Choose parties
        </button>

        <div id="partyPickerPanel" class="party-picker-panel" hidden>
          <div class="party-picker-actions">
            <button id="selectAllParties" type="button">Select all</button>
            <button id="clearAllParties" type="button">Clear all</button>
          </div>
          <div id="partyCheckboxes" class="party-checkboxes"></div>
        </div>
      </div>

      <label id="monthsControl" class="months-control" hidden>
        <span>Months shown</span>
        <input id="monthsInput" type="number" min="1" max="999"
               value="13" step="1" inputmode="numeric"
               aria-label="Number of months to show">
      </label>
    </div>
  </div>

  <section class="chart-panel">
    <div class="chart-wrap">
      <canvas id="chart" aria-label="Polling chart" role="img"></canvas>
    </div>
    <div class="legend" id="customLegend"></div>
    <p class="chart-note" id="chartNote"></p>
  </section>
</main>

<footer>
  Polling figures are based on the supplied Tushtoan data.
  Chart.js is loaded from a CDN, so an internet connection is required.
</footer>

const fmt = value =>
  value === null || value === undefined ? "—" : value;

function dataset(label, data, color, extra = {}) {
  return {
    label,
    data,
    borderColor: color,
    backgroundColor: color,
    ...extra
  };
}

function drawLegend(items) {
  legendEl.innerHTML = "";

  items.forEach(item => {
    const node = document.createElement("span");
    node.className = "legend-item";

    const swatch = document.createElement("i");
    swatch.className = "swatch";
    swatch.style.background = item.color;

    const label = document.createElement("span");
    label.textContent = item.label;

    node.append(swatch, label);
    legendEl.appendChild(node);
  });
}

  if (chart) chart.destroy();

  chart = new Chart(chartCanvas, {
    type,
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: "index",
        intersect: false
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: context =>
              `${context.dataset.label}: ${fmt(context.parsed.y)}`
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: {
            maxRotation: 45,
            minRotation: 0,
            autoSkip: true,
            maxTicksLimit: 20
          }
        },
        y: {
          beginAtZero: true,
          grid: { color: "#edf0f5" },
          title: {
            display: !!opts.yTitle,
            text: opts.yTitle || ""
          }
        }
      },
      elements: {
        line: { borderWidth: 2.5 },
        point: {
          radius: type === "line" ? 2.5 : 3,
          hoverRadius: 5
        }
      },
      ...opts.options
    }
  });

  drawLegend(
    datasets.map(d => ({
      label: d.label,
      color: d.borderColor || d.backgroundColor
    }))
  );
}

/* Historical data uses "L" for Levitatie. */
function comparisonValue(series, id) {
  const key = id === "L" ? "Levitatie" : id;
  return series[key];
}

function renderPollComparison() {
  titleEl.textContent = "Newest poll vs. previous poll";

  const order = parties
    .map(p => p.id)
    .filter(id =>
      comparisonValue(latestComparison.newest, id) !== undefined ||
      comparisonValue(latestComparison.previous, id) !== undefined
    );

  const labels = order.map(id => partyById[id]?.name || id);

  const newest = order.map(id =>
    comparisonValue(latestComparison.newest, id) ?? null
  );

  const previous = order.map(id =>
    comparisonValue(latestComparison.previous, id) ?? null
  );

  makeChart("bar", labels, [
    dataset("Previous poll", previous, "#6a63a6", {
      borderRadius: 5,
      categoryPercentage: .72,
      barPercentage: .85
    }),
    dataset("Newest poll", newest, "#ff9a0a", {
      borderRadius: 5,
      categoryPercentage: .72,
      barPercentage: .85
    })
  ], {
    yTitle: "Poll figure",
    options: {
      scales: {
        x: {
          grid: { display: false },
          ticks: {
            maxRotation: 55,
            minRotation: 0,
            autoSkip: false
          }
        },
        y: {
          beginAtZero: true,
          grid: { color: "#edf0f5" }
        }
      }
    }
  });

  noteEl.textContent =
    "Purple-blue-grey bars show the previous poll (September 2026); orange bars show the newest poll (October 2026).";
}

function renderElection() {
  titleEl.textContent = "Newest poll vs. previous election";

  const order = parties
    .map(p => p.id)
    .filter(id =>
      comparisonValue(latestComparison.newest, id) !== undefined &&
      electionResults[id] !== null &&
      electionResults[id] !== undefined
    );

  const labels = order.map(id => partyById[id]?.name || id);

  makeChart("bar", labels, [
    dataset(
      "Previous election",
      order.map(id => electionResults[id]),
      "#6a63a6",
      {
        borderRadius: 5,
        categoryPercentage: .72,
        barPercentage: .85
      }
    ),
    dataset(
      "Newest poll",
      order.map(id => comparisonValue(latestComparison.newest, id)),
      "#ff9a0a",
      {
        borderRadius: 5,
        categoryPercentage: .72,
        barPercentage: .85
      }
    )
  ], {
    yTitle: "Poll figure / seats",
    options: {
      scales: {
        x: {
          grid: { display: false },
          ticks: {
            maxRotation: 55,
            minRotation: 0,
            autoSkip: false
          }
        },
        y: {
          beginAtZero: true,
          grid: { color: "#edf0f5" }
        }
      }
    }
  });

  noteEl.textContent =
    "Purple-blue-grey bars show the previous election; orange bars show the newest poll (October 2026). " +
    "Polling figures and election seats are different measures.";
}

function getRequestedMonths() {
  const value = Number.parseInt(monthsInput.value, 10);
  return Number.isInteger(value) && value > 0
    ? Math.min(value, 999)
    : 13;
}

function rowsForSelectedMonthCount(rows) {
  return rows.slice(-getRequestedMonths());
}

function monthRangeDescription(rows, requestedMonths) {
  if (rows.length < requestedMonths) {
    return `Showing all ${rows.length} available monthly entries; ${requestedMonths} requested.`;
  }
  return `Showing the most recent ${rows.length} monthly entries.`;
}

function renderParties() {
  titleEl.textContent = "Party developments";
  partyPicker.hidden = false;
  monthsControl.hidden = false;

  const requestedMonths = getRequestedMonths();
  const rows = rowsForSelectedMonthCount(monthlyPartyPolls);

  const selectedParties = parties.filter(
    party => selectedPartyIds.has(party.id)
  );

  const labels = rows.map(row => row.month);

  const datasets = selectedParties.map(party => {
    const values = rows.map(row =>
      row[party.id] === undefined ? null : row[party.id]
    );

    return dataset(party.name, values, party.color, {
      tension: .38,
      cubicInterpolationMode: "monotone",
      spanGaps: false,
      pointBackgroundColor: party.color,
      pointBorderColor: party.color,
      fill: false
    });
  });

  makeChart("line", labels, datasets, {
    yTitle: "Poll figure"
  });

  if (selectedParties.length === 0) {
    noteEl.textContent =
      "No parties selected. Open Choose parties and tick at least one party to display its polling line.";
  } else {
    noteEl.textContent =
      `Showing ${selectedParties.length} selected ` +
      `${selectedParties.length === 1 ? "party" : "parties"}. ` +
      "Tick or untick parties in Choose parties to change the lines. " +
      "Smooth curves are enabled; missing values remain gaps. " +
      monthRangeDescription(rows, requestedMonths);
  }
}

function renderBlocs() {
  titleEl.textContent = "Developments: left, centre & right";
  partyPicker.hidden = true;
  monthsControl.hidden = false;

  const requestedMonths = getRequestedMonths();
  const rows = rowsForSelectedMonthCount(monthlyBlocs);

  const definitions = [
    ["Left", blocColors.Left],
    ["Centre", blocColors.Centre],
    ["Right", blocColors.Right]
  ];

  const datasets = definitions.map(([key, color]) =>
    dataset(
      key,
      rows.map(row => row[key] ?? null),
      color,
      {
        tension: .38,
        cubicInterpolationMode: "monotone",
        spanGaps: false,
        pointBackgroundColor: color,
        fill: false
      }
    )
  );

  makeChart(
    "line",
    rows.map(row => row.month),
    datasets,
    { yTitle: "Bloc total" }
  );

  noteEl.textContent =
    "Bloc totals from the supplied table. " +
    monthRangeDescription(rows, requestedMonths) +
    " The current source data ends in September 2026.";
}

function render() {
  document.querySelectorAll(".menu-btn").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.view === currentView
    );
  });

  if (currentView === "polls") {
    partyPicker.hidden = true;
    monthsControl.hidden = true;
    closePartyPicker();
    renderPollComparison();
  }

  if (currentView === "election") {
    partyPicker.hidden = true;
    monthsControl.hidden = true;
    closePartyPicker();
    renderElection();
  }

  if (currentView === "parties") {
    renderParties();
  }

  if (currentView === "blocs") {
    partyPicker.hidden = true;
    monthsControl.hidden = false;
    closePartyPicker();
    renderBlocs();
  }
}

function populatePartyPicker() {
  partyCheckboxes.innerHTML = "";

  parties.forEach(party => {
    const label = document.createElement("label");
    label.className = "party-option";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = party.id;
    checkbox.checked = selectedPartyIds.has(party.id);

    checkbox.addEventListener("change", () => {
      if (checkbox.checked) {
        selectedPartyIds.add(party.id);
      } else {
        selectedPartyIds.delete(party.id);
      }

      updatePartyPickerButton();

      if (currentView === "parties") {
        renderParties();
      }
    });

    const swatch = document.createElement("i");
    swatch.className = "swatch";
    swatch.style.backgroundColor = party.color;

    const name = document.createElement("span");
    name.textContent = party.name;

    label.append(checkbox, swatch, name);
    partyCheckboxes.appendChild(label);
  });

  updatePartyPickerButton();
}

function updatePartyPickerButton() {
  const count = selectedPartyIds.size;

  partyPickerToggle.textContent = count === 1
    ? "Choose parties (1 selected) ▾"
    : `Choose parties (${count} selected) ▾`;
}

function closePartyPicker() {
  partyPickerPanel.hidden = true;
  partyPickerToggle.setAttribute("aria-expanded", "false");
}

document.querySelectorAll(".menu-btn").forEach(button => {
  button.addEventListener("click", () => {
    currentView = button.dataset.view;
    render();
  });
});

partyPickerToggle.addEventListener("click", () => {
  const willOpen = partyPickerPanel.hidden;
  partyPickerPanel.hidden = !willOpen;
  partyPickerToggle.setAttribute("aria-expanded", String(willOpen));
});

selectAllPartiesButton.addEventListener("click", () => {
  parties.forEach(party => selectedPartyIds.add(party.id));
  populatePartyPicker();

  if (currentView === "parties") {
    renderParties();
  }
});

clearAllPartiesButton.addEventListener("click", () => {
  selectedPartyIds.clear();
  populatePartyPicker();

  if (currentView === "parties") {
    renderParties();
  }
});

document.addEventListener("click", event => {
  if (!partyPicker.contains(event.target)) {
    closePartyPicker();
  }
});

monthsInput.addEventListener("change", () => {
  const value = Number.parseInt(monthsInput.value, 10);

  monthsInput.value = Number.isInteger(value) && value > 0
    ? Math.min(value, 999)
    : 13;

  if (currentView === "parties") {
    renderParties();
  }

  if (currentView === "blocs") {
    renderBlocs();
  }
});

monthsInput.value = "13";
populatePartyPicker();
render();
</script>
</body>
</html>
